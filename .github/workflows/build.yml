name: Build and Release CV

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_pdflatex: true

      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv
          path: main.pdf

      - name: Release PDF
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest CV
          files: main.pdf
          body: Auto-generated from the latest commit.
